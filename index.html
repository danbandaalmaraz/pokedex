<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

  <h1 class="text-center mb-4">Pokédex</h1>

  <!-- 1. Búsqueda -->
  <div class="input-group mb-4">
    <input id="nombre" type="text" class="form-control" placeholder="Nombre del pokémon">
    <button class="btn btn-primary" onclick="buscarPorNombre()">Buscar por nombre</button>
    <button class="btn btn-warning" onclick="buscarAleatorio()">Buscar aleatorio</button>
  </div>

  <!-- 2. Ficha -->
  <div id="ficha" class="card mx-auto mb-4 d-none" style="max-width: 300px;">
    <img id="imagen" class="card-img-top">
    <div class="card-body">
      <h5 id="titulo" class="card-title text-capitalize"></h5>
      <p class="mb-1"><strong>Tipo:</strong> <span id="tipos"></span></p>
      <p class="mb-1"><strong>Altura:</strong> <span id="altura"></span> m</p>
      <p class="mb-3"><strong>Peso:</strong> <span id="peso"></span> kg</p>
      <button class="btn btn-info w-100 mb-2" data-bs-toggle="modal" data-bs-target="#modal">Ver más</button>
      <button class="btn btn-success w-100" onclick="agregarATabla()">Añadir a la tabla</button>
    </div>
  </div>

  <!-- 3. Tabla -->
  <table class="table table-bordered">
    <thead class="table-dark">
      <tr><th>ID</th><th>Imagen</th><th>Nombre</th><th>Tipo</th></tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>

  <!-- 4. Modal con más información -->
  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="modalTitulo" class="modal-title text-capitalize"></h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p><strong>Habilidades:</strong> <span id="habilidades"></span></p>
          <p><strong>Experiencia base:</strong> <span id="experiencia"></span></p>
          <p><strong>Estadísticas:</strong></p>
          <ul id="stats"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const URL_API = 'https://pokeapi.co/api/v2/pokemon/';
    let pokemonActual = null;
    const equipo = [];

    function buscarPorNombre() {
      const nombre = document.getElementById('nombre').value.trim().toLowerCase();
      if (nombre === '') {
        alert('Escribe un nombre');
        return;
      }
      buscarPokemon(nombre);
    }

    function buscarAleatorio() {
      const id = Math.floor(Math.random() * 150) + 1;
      buscarPokemon(id);
    }

    async function buscarPokemon(param) {
      try {
        const respuesta = await fetch(URL_API + param);
        if (!respuesta.ok) throw new Error('Pokémon no encontrado');
        pokemonActual = await respuesta.json();
        mostrarFicha(pokemonActual);
      } catch (error) {
        alert(error.message);
      }
    }

    function mostrarFicha(p) {
      
      document.getElementById('imagen').src = p.sprites.front_default;
      document.getElementById('titulo').textContent = '#' + p.id + ' ' + p.name;
      document.getElementById('tipos').textContent = p.types.map(t => t.type.name).join(', ');
      document.getElementById('altura').textContent = p.height / 10;
      document.getElementById('peso').textContent = p.weight / 10;

      
      document.getElementById('modalTitulo').textContent = p.name;
      document.getElementById('habilidades').textContent = p.abilities.map(a => a.ability.name).join(', ');
      document.getElementById('experiencia').textContent = p.base_experience;
      document.getElementById('stats').innerHTML = p.stats
        .map(s => `<li>${s.stat.name}: ${s.base_stat}</li>`)
        .join('');

      document.getElementById('ficha').classList.remove('d-none');
    }

    function agregarATabla() {
      if (equipo.some(p => p.id === pokemonActual.id)) {
        alert('Ese pokémon ya está en la tabla');
        return;
      }
      if (equipo.length >= 6) {
        alert('Máximo 6 pokémon');
        return;
      }
      equipo.push(pokemonActual);

      const fila = document.createElement('tr');
      fila.innerHTML = `
        <td>${pokemonActual.id}</td>
        <td><img src="${pokemonActual.sprites.front_default}" width="60"></td>
        <td class="text-capitalize">${pokemonActual.name}</td>
        <td>${pokemonActual.types.map(t => t.type.name).join(', ')}</td>`;
      document.getElementById('tabla').appendChild(fila);
    }
  </script>
</body>
</html>
